services:
  codeaudit:
    build:
      context: .
      target: local
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CODEAUDIT_AI_ENABLED: ${CODEAUDIT_AI_ENABLED:-true}
      CODEAUDIT_GEMINI_MODEL: ${CODEAUDIT_GEMINI_MODEL:-gemini-3.5-flash-lite}
      CODEAUDIT_DAILY_LIMIT: ${CODEAUDIT_DAILY_LIMIT:-3}
      CODEAUDIT_CONCURRENCY: ${CODEAUDIT_CONCURRENCY:-2}
      CODEAUDIT_TIMEOUT_SECONDS: ${CODEAUDIT_TIMEOUT_SECONDS:-300}
      CODEAUDIT_TOOL_TIMEOUT_SECONDS: ${CODEAUDIT_TOOL_TIMEOUT_SECONDS:-90}
      CODEAUDIT_MAX_REPOSITORY_MB: ${CODEAUDIT_MAX_REPOSITORY_MB:-20}
      CODEAUDIT_MAX_FILES: ${CODEAUDIT_MAX_FILES:-2000}
      CODEAUDIT_MAX_FILE_BYTES: ${CODEAUDIT_MAX_FILE_BYTES:-512000}
      CODEAUDIT_MAX_REPORT_BYTES: ${CODEAUDIT_MAX_REPORT_BYTES:-800000}
      CODEAUDIT_RETENTION_HOURS: ${CODEAUDIT_RETENTION_HOURS:-24}
      CODEAUDIT_ACCEPTING_AUDITS: ${CODEAUDIT_ACCEPTING_AUDITS:-true}
      CODEAUDIT_AI_CHUNK_CHARS: ${CODEAUDIT_AI_CHUNK_CHARS:-24000}
      CODEAUDIT_AI_MAX_TOTAL_TOKENS: ${CODEAUDIT_AI_MAX_TOTAL_TOKENS:-60000}
      CODEAUDIT_AI_MAX_OUTPUT_TOKENS: ${CODEAUDIT_AI_MAX_OUTPUT_TOKENS:-3000}
      CODEAUDIT_AI_MAX_CALLS: ${CODEAUDIT_AI_MAX_CALLS:-12}
      CODEAUDIT_AI_PRICE_CEILING_PER_MILLION: ${CODEAUDIT_AI_PRICE_CEILING_PER_MILLION:-20}
      CODEAUDIT_AI_MAX_COST_USD: ${CODEAUDIT_AI_MAX_COST_USD:-1.5}
      CODEAUDIT_DAILY_BUDGET_USD: ${CODEAUDIT_DAILY_BUDGET_USD:-3}
    volumes:
      - audit-data:/app/.audit-work
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
volumes:
  audit-data:
