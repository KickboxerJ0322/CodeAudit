apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: codeaudit-worker
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: codeaudit-worker@jumpeicloud.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: '900'
          containers:
            - image: asia-northeast1-docker.pkg.dev/jumpeicloud/codeaudit/worker:REPLACE_COMMIT_SHA
              resources:
                limits: {cpu: '2', memory: 2Gi}
              env:
                - {name: GOOGLE_CLOUD_PROJECT, value: jumpeicloud}
                - {name: CODEAUDIT_STORE, value: firestore}
                - {name: CODEAUDIT_FIRESTORE_DATABASE, value: codeaudit}
                - {name: CODEAUDIT_TIMEOUT_SECONDS, value: '780'}
                - {name: CODEAUDIT_DAILY_LIMIT, value: '20'}
                - {name: CODEAUDIT_DAILY_BUDGET_USD, value: '10'}
                - {name: CODEAUDIT_AI_PRICE_CEILING_PER_MILLION, value: '5'}
                - {name: CODEAUDIT_AI_MAX_TOTAL_TOKENS, value: '720000'}
                - {name: CODEAUDIT_AI_MAX_CALLS, value: '64'}
                - {name: CODEAUDIT_AI_MAX_OUTPUT_TOKENS, value: '6000'}
                - {name: CODEAUDIT_AI_MAX_COST_USD, value: '4'}
                - {name: CODEAUDIT_WORK_ROOT, value: /tmp/codeaudit}
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef: {name: codeaudit-gemini-key, key: latest}
                - name: CODEAUDIT_IDENTITY_SALT
                  valueFrom:
                    secretKeyRef: {name: codeaudit-identity-salt, key: latest}
