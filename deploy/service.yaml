apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: codeaudit
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '3'
    spec:
      serviceAccountName: codeaudit-api@jumpeicloud.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 30
      containers:
        - image: asia-northeast1-docker.pkg.dev/jumpeicloud/codeaudit/api:REPLACE_COMMIT_SHA
          ports: [{containerPort: 8080}]
          resources:
            limits: {cpu: '1', memory: 512Mi}
          env:
            - {name: GOOGLE_CLOUD_PROJECT, value: jumpeicloud}
            - {name: CODEAUDIT_STORE, value: firestore}
            - {name: CODEAUDIT_FIRESTORE_DATABASE, value: codeaudit}
            - {name: CODEAUDIT_DISPATCHER, value: cloud_run}
            - {name: CODEAUDIT_REGION, value: asia-northeast1}
            # Trust only the observed Cloud Run ingress peer, never all proxy senders.
            - {name: FORWARDED_ALLOW_IPS, value: '127.0.0.1,169.254.169.126'}
            # Selected model's text output is $2.50/M at standard tier (2026-10-10).
            - {name: CODEAUDIT_AI_PRICE_CEILING_PER_MILLION, value: '5'}
            - {name: CODEAUDIT_JOB_NAME, value: codeaudit-worker}
            # Public beta intake; limits and viewing-token protection remain enabled.
            - {name: CODEAUDIT_ACCEPTING_AUDITS, value: 'true'}
            - name: CODEAUDIT_IDENTITY_SALT
              valueFrom:
                secretKeyRef: {name: codeaudit-identity-salt, key: latest}
