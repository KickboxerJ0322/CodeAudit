name: Deploy CodeAudit (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Deploy to Google Cloud (may incur charges): type DEPLOY'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: codeaudit-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'KickboxerJ0322/CodeAudit' && github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'jumpeicloud' }}
      REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/331230486346/locations/global/workloadIdentityPools/github/providers/codeaudit
          service_account: codeaudit-deployer@jumpeicloud.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Test and build on Google Cloud
        run: |
          gcloud builds submit --no-source --config cloudbuild.yaml --project "$PROJECT_ID" --region "$REGION" --service-account "projects/$PROJECT_ID/serviceAccounts/codeaudit-builder@$PROJECT_ID.iam.gserviceaccount.com" --substitutions "_REGION=$REGION,_COMMIT_SHA=$GITHUB_SHA"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python deploy/render.py --project "$PROJECT_ID" --region "$REGION" --sha "$GITHUB_SHA"
      - name: Deploy worker and API (private by default, intake closed)
        run: |
          gcloud run jobs replace artifacts/deploy/job.yaml --project "$PROJECT_ID" --region "$REGION"
          gcloud run services replace artifacts/deploy/service.yaml --project "$PROJECT_ID" --region "$REGION"
