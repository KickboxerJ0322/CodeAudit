name: Deploy CodeAudit (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Deploy to Google Cloud (may incur charges): type DEPLOY'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: codeaudit-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'KickboxerJ0322/CodeAudit' && github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'jumpeicloud' }}
      REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.lock && python -m pip install -e '.[test]' && python -m pytest -q
        working-directory: backend
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push immutable commit images
        run: |
          docker build --target api -t "$REGION-docker.pkg.dev/$PROJECT_ID/codeaudit/api:$GITHUB_SHA" .
          docker build --target worker -t "$REGION-docker.pkg.dev/$PROJECT_ID/codeaudit/worker:$GITHUB_SHA" .
          docker push "$REGION-docker.pkg.dev/$PROJECT_ID/codeaudit/api:$GITHUB_SHA"
          docker push "$REGION-docker.pkg.dev/$PROJECT_ID/codeaudit/worker:$GITHUB_SHA"
      - run: python deploy/render.py --project "$PROJECT_ID" --region "$REGION" --sha "$GITHUB_SHA"
      - name: Deploy worker and API (private by default, intake closed)
        run: |
          gcloud run jobs replace artifacts/deploy/job.yaml --project "$PROJECT_ID" --region "$REGION"
          gcloud run services replace artifacts/deploy/service.yaml --project "$PROJECT_ID" --region "$REGION"
