steps:
  - name: gcr.io/cloud-builders/git
    args: ['clone', '--filter=blob:none', 'https://github.com/KickboxerJ0322/CodeAudit.git', 'source']
  - name: gcr.io/cloud-builders/git
    args: ['-C', 'source', 'checkout', '${_COMMIT_SHA}']
  - name: python:3.12-slim-bookworm
    dir: source/backend
    entrypoint: sh
    args: ['-c', 'pip install -r requirements.lock && pip install ".[test]" && python -m pytest -q']
  - name: node:24-bookworm-slim
    dir: source/frontend
    entrypoint: sh
    args: ['-c', 'npm ci --no-audit --no-fund && npm test && npm run build']
  - name: gcr.io/cloud-builders/docker
    dir: source
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '--target', 'api', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/codeaudit/api:${_COMMIT_SHA}', '.']
  - name: gcr.io/cloud-builders/docker
    dir: source
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '--target', 'worker', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/codeaudit/worker:${_COMMIT_SHA}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['run', '--rm', '--entrypoint', 'semgrep', '${_REGION}-docker.pkg.dev/$PROJECT_ID/codeaudit/worker:${_COMMIT_SHA}', 'scan', '--validate', '--config', '/app/backend/app/rules/security.yml', '--metrics', 'off', '--disable-version-check']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/codeaudit/api:${_COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/codeaudit/worker:${_COMMIT_SHA}'
substitutions:
  _REGION: asia-northeast1
  _COMMIT_SHA: main
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
